[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "carbon-black-demand-nlp"
version = "0.1.0"
description = "Text analysis of synthetic carbon black demand survey data."
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
carbon-black-demand-nlp = "demand_nlp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
