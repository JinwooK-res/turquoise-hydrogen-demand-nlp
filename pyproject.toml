[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "turquoise-hydrogen-demand-nlp"
version = "0.1.0"
description = "NLP and survey analysis for turquoise-hydrogen byproduct carbon-black demand research."
requires-python = ">=3.10"
dependencies = [
    "matplotlib>=3.8",
    "pandas>=2.0",
    "scikit-learn>=1.3",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
turquoise-demand-nlp = "demand_nlp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
